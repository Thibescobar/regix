extends: base
name: ct_mr_abdomen
description: >
  Abdominal MR registered onto CT (or the reverse). Typical use case:
  characterising a liver lesion seen on MR against the reference CT. The anatomix
  features make the pair comparable from the rigid stage onwards; mutual
  information remains the automatic fallback when torch/anatomix are absent.
  A 20 mm B-spline because the liver moves 10 to 25 mm with breathing.

fixed_modality: CT
moving_modality: MR

preprocess:
  working_spacing_mm: 2.0
  # The [-450, 450] HU window and the [0, 1] normalisation this preset used to declare
  # here are anatomix's, not the registration's: the feature path applies them itself
  # (clip_for_modality + normalize_for_features). Declaring them here as well pushed
  # them onto the intensity images too, which is what broke third-party parameter files
  # -- and it also defeated anatomix's own clipping, since clipping [0, 1] data to
  # [-450, 450] HU is a no-op.
  fixed:
    percentile_clip: null        # native HU: nothing to bound on a CT
  moving:
    percentile_clip: [0.5, 99.5] # MR outliers only; the scale is preserved
    # N4 off by default: this preset runs on anatomix/MIND features (features.enabled:
    # auto on a CT-MR pair), and those descriptors are already contrast-invariant, so
    # the correction buys almost nothing. Turn it on if you force metric: mi or ncc on
    # the intensities and the B1 field is visible.
    n4_bias_correction: false

features:
  enabled: auto
  variant: anatomix
  n_components: 4

organs:
  backend: none                  # switch to totalsegmentator/external when available
  targets: [liver]
  mask_dilate_mm: 10.0
  roi_crop: false
  qc_labels: [liver, spleen, kidney_left, kidney_right]

init:
  mode: multistart
  candidates: [geometry, moments, organ_centroid]
  multistart_rotations_deg:
    - [0, 0, 0]
    - [0, 0, 10]
    - [0, 0, -10]

stages:
  - type: rigid
    metric: auto
    n_resolutions: 4
    max_iterations: 768
    n_spatial_samples: 6000
  - type: affine
    metric: auto
    n_resolutions: 3
    max_iterations: 512
    n_spatial_samples: 6000
  - type: bspline
    metric: auto
    n_resolutions: 3
    max_iterations: 512
    n_spatial_samples: 8000
    final_grid_spacing_mm: 20.0
    bending_energy_weight: 1.0

deformable_engine: elastix

qc:
  n_slices: 3
  gates:
    min_nmi_gain: 0.0
    max_folding_fraction: 0.001
    min_dice:
      liver: 0.85
