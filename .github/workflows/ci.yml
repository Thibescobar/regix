name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push cancels the previous run on the same branch: no point burning
# minutes on an already-outdated commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # matplotlib must not look for a display on a headless runner.
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        # Pinned, and kept in step with the `dev` extra in pyproject.toml: an
        # unpinned ruff makes this job fail on a release, not on a commit.
        run: pip install "ruff>=0.16,<0.17"
      - name: Lint
        run: ruff check regix tests
      - name: Format check
        run: ruff format --check --diff regix tests
      - name: Static types (progressive)
        run: |
          pip install "mypy>=1.10,<2" "types-PyYAML>=6.0.12,<7"
          mypy regix
        continue-on-error: true
      - name: Dead-code inventory
        run: |
          pip install "vulture>=2.11,<3"
          vulture regix .vulture_allowlist.py --min-confidence 90

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CPU test environment (no GPU or model weights)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Environment check
        # `regix doctor` exits non-zero when the registration engine is missing:
        # this is a real smoke test of the itk-elastix installation, not decoration.
        run: regix doctor

      - name: Unit tests
        run: pytest tests/test_units.py -q --durations=10

      - name: CLI and DICOM tests
        run: pytest tests/test_cli.py tests/test_dicom_io.py -q --durations=10

      - name: End-to-end phantom tests
        # These are the tests that actually prove the registration is correct: they
        # impose a known transform on a phantom and check it is recovered to within
        # a voxel. Slower (~2-4 min), so run after the others.
        run: pytest tests/test_pipeline.py -q --durations=10

      - name: Contract and documentation tests
        # The safety net the correction waves lean on: the golden transform, what a run
        # leaves on disk, and the claims the README makes about itself. The former audit
        # xfails are ordinary regression tests now that their contracts are corrected.
        #
        # The golden reference is machine-specific (elastix determinism is a property of
        # the build), so on a runner it skips rather than failing. What still runs
        # everywhere: the artefact inventory, strict-JSON serialisation, the PHI canary
        # and the whole documentation file.
        run: pytest tests/test_contract.py tests/test_documentation.py -q --durations=10

      - name: Coverage gate
        if: matrix.python == '3.12'
        # The threshold sits just below the figure on the README badge, so the badge
        # cannot silently drift: a drop in coverage turns CI red.
        run: pytest -q --cov=regix --cov-report=term-missing:skip-covered --cov-fail-under=81

  api:
    name: HTTP service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Regix with the api extra
        # The only job that installs an optional extra. Two things are being checked
        # here, not one: that `regix[api]` still resolves -- no other job would notice
        # if it stopped -- and that the service behaves. Before this job existed,
        # regix/api.py was never even imported in CI, so a syntax error in it would
        # have reached main.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]" httpx

      - name: Service tests
        run: pytest tests/test_api.py -q --durations=10

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Every command loads and every preset validates
        run: |
          regix version
          regix --help
          regix presets
          python -c "
          from regix.config import available_presets, load_preset
          names = available_presets()
          for name in names:
              cfg = load_preset(name)
              assert cfg.stages, name
          print(f'{len(names)} presets validated: ' + ', '.join(names))
          "

      - name: Full registration through the CLI on a generated phantom
        # Uses the test phantom, so no patient data ever reaches CI.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import SimpleITK as sitk
          from tests.conftest import known_rigid, make_phantom, warp

          fixed, _ = make_phantom("CT", noise=3.0)
          moving = warp(fixed, known_rigid(fixed))
          sitk.WriteImage(sitk.Cast(fixed, sitk.sitkFloat32), "ci_fixed.nii.gz", True)
          sitk.WriteImage(sitk.Cast(moving, sitk.sitkFloat32), "ci_moving.nii.gz", True)
          PY
          regix register ci_fixed.nii.gz ci_moving.nii.gz -o ci_out \
            --fixed-modality CT --moving-modality CT --overwrite --log-level WARNING
          test -f ci_out/report.html
          test -f ci_out/run_manifest.json
          test -f ci_out/transform/final_transform.itk.txt
          test -f ci_out/moving_registered.nii.gz

      - name: Upload the QC report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-report
          path: |
            ci_out/report.html
            ci_out/run_manifest.json
          if-no-files-found: error
          retention-days: 14

  extras:
    name: Optional extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extra: [report, api, features, organs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install one extra and import the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"
          python -c "import regix; print(regix.__version__)"

  packaging:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and inspect sdist/wheel
        run: |
          pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          twine check dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/regix-wheel
          /tmp/regix-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/regix-wheel/bin/regix --version
          /tmp/regix-wheel/bin/regix presets base > /tmp/base.yaml
          /tmp/regix-wheel/bin/python -c "from regix.config import load_preset; assert load_preset('base').stages"

  dependency-contracts:
    name: Dependency contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject the unsupported pydicom 2.x line
        run: |
          python -m pip install --upgrade pip
          if pip install -e . "pydicom==2.4.4"; then
            echo "pydicom 2.4.4 unexpectedly satisfied the project metadata"
            exit 1
          fi
      - name: Reproduce the locked numerical environment
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
          regix doctor
          pytest tests/test_contract.py -k "golden or two_runs" -q
