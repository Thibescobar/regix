name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import regix
          assert os.environ["GITHUB_REF_NAME"] == f"v{regix.__version__}"
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check --strict dist/*
          python - <<'PY'
          import email
          from pathlib import Path
          import tomllib
          import zipfile
          import regix
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_path = next(p for p in wheel.namelist() if p.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(wheel.read(metadata_path))
              assert metadata["Name"] == project["name"]
              assert metadata["Version"] == regix.__version__
              assert metadata["License-Expression"] == project["license"]
              license_path = next(p for p in wheel.namelist() if p.endswith(".dist-info/licenses/LICENSE"))
              assert wheel.read(license_path) == Path("LICENSE").read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/regix-medical/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
