[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "regix-medical"
dynamic = ["version"]
description = "Multimodal / multi-organ medical image registration (elastix + anatomix features + organ segmentation)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Thibault Escobar" }]
keywords = ["registration", "elastix", "anatomix", "medical-imaging", "dicom", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core: runs on CPU, with no GPU and no neural network.
dependencies = [
    # Registration engine. Note: the official SimpleITK wheels do NOT bundle elastix
    # any more (SimpleElastix is no longer distributed for recent Python versions);
    # itk-elastix is the binding maintained by the elastix authors.
    "itk-elastix>=0.20,<0.26",
    "SimpleITK>=2.2,<3",       # DICOM I/O, morphology, transforms, metrics, box filtering
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.0,<16",
    "pydicom>=3.0,<4",
]

[project.optional-dependencies]
# Torch/Monai feature tooling + ConvexAdam-style deformation. The anatomix backend is
# installed explicitly from upstream after its code, weights and terms are reviewed.
features = [
    "torch>=2.1,<3",
    "monai>=1.3,<2",
    "nibabel>=5.0,<6",
    "huggingface_hub>=0.20,<2",
]
# Organ segmentation. The one automatic backend is TotalSegmentator, which pulls its
# own torch/nibabel; `organs` is kept as an alias so documented installs keep working.
totalsegmentator = ["TotalSegmentator>=2.2,<3"]
organs = ["TotalSegmentator>=2.2,<3"]
report = ["matplotlib>=3.7,<4"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.9,<1"]
# ruff is pinned to a minor range, unlike the rest: it is the one tool whose new
# releases add rules to the sets selected below, so an unpinned `ruff>=x` turns CI
# red on a day nobody touched the code.
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.16,<0.17",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0.12,<7",
    "vulture>=2.11,<3",
    "build>=1.2,<2",
    "twine>=5,<7",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
]
all = ["regix-medical[features,organs,api,report]"]

[project.urls]
Homepage = "https://github.com/Thibescobar/regix"
Repository = "https://github.com/Thibescobar/regix"
Issues = "https://github.com/Thibescobar/regix/issues"

[project.scripts]
regix = "regix.cli:main"

[tool.setuptools.packages.find]
include = ["regix*"]

[tool.setuptools.dynamic]
version = { attr = "regix.__version__" }

[tool.setuptools.package-data]
regix = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The suites import shared phantom builders as `from tests.conftest import ...`, so
# the repository root has to be importable. `python -m pytest` puts the working
# directory on sys.path and hides the need for this; the bare `pytest` console
# script does not, which is how CI runs it. Declaring it here makes both spellings
# behave the same.
pythonpath = ["."]
markers = [
    "gpu: requires a GPU and torch",
    "slow: full registration, takes minutes",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # `Optional[X]` in signatures is required by typer: it uses the annotation to
    # build the CLI, and `X | None` is not equivalent for its parser.
    "UP045",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` / `Field(...)` as a default value is the documented idiom of
# typer and pydantic; B008 cannot be satisfied without breaking both.
"regix/cli.py" = ["B008"]
"regix/api.py" = ["B008"]
"regix/config.py" = ["B008"]

[tool.mypy]
# Static analysis runs in the Python 3.12 lint job. Runtime compatibility with
# 3.10/3.11 is exercised by the test matrix; using 3.12 here also lets mypy parse
# the PEP 695 declarations shipped by the NumPy version installed in that job.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
