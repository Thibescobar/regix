[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regix"
version = "0.1.0"
description = "Multimodal / multi-organ medical image registration (elastix + anatomix features + organ segmentation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Thibault Escobar" }]
keywords = ["registration", "elastix", "anatomix", "medical-imaging", "dicom", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core: runs on CPU, with no GPU and no neural network.
dependencies = [
    # Registration engine. Note: the official SimpleITK wheels do NOT bundle elastix
    # any more (SimpleElastix is no longer distributed for recent Python versions);
    # itk-elastix is the binding maintained by the elastix authors.
    "itk-elastix>=0.20",
    "SimpleITK>=2.2",       # DICOM I/O, morphology, transforms, metrics
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.7",
    "pydicom>=2.4",
]

[project.optional-dependencies]
# anatomix features (multimodal registration made monomodal) + ConvexAdam-style deformable.
features = [
    "torch>=2.1",
    "monai>=1.3",
    "nibabel>=5.0",
    "huggingface_hub>=0.20",
    "anatomix @ git+https://github.com/neel-dey/anatomix.git",
]
# Organ segmentation: either SuPreM (abdominal CT, research-only weights) or TotalSegmentator.
organs = [
    "torch>=2.1",
    "monai>=1.3",
    "nibabel>=5.0",
]
totalsegmentator = ["TotalSegmentator>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# ruff is pinned to a minor range, unlike the rest: it is the one tool whose new
# releases add rules to the sets selected below, so an unpinned `ruff>=x` turns CI
# red on a day nobody touched the code.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16,<0.17"]
all = ["regix[features,organs,api,dev]"]

[project.urls]
Homepage = "https://github.com/Thibescobar/regix"
Repository = "https://github.com/Thibescobar/regix"
Issues = "https://github.com/Thibescobar/regix/issues"

[project.scripts]
regix = "regix.cli:main"

[tool.setuptools.packages.find]
include = ["regix*"]

[tool.setuptools.package-data]
regix = ["presets/*.yaml", "qc/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The suites import shared phantom builders as `from tests.conftest import ...`, so
# the repository root has to be importable. `python -m pytest` puts the working
# directory on sys.path and hides the need for this; the bare `pytest` console
# script does not, which is how CI runs it. Declaring it here makes both spellings
# behave the same.
pythonpath = ["."]
markers = [
    "gpu: requires a GPU and torch",
    "slow: full registration, takes minutes",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # `Optional[X]` in signatures is required by typer: it uses the annotation to
    # build the CLI, and `X | None` is not equivalent for its parser.
    "UP045",
    "UP007",
    # `isinstance(x, (int, float))` stays clearer than the PEP 604 form here.
    # Kept even though ruff removed UP038 in 0.14: recent versions merely warn that
    # ignoring it is a no-op, while dropping the entry makes older ruff report three
    # errors. Ignoring a rule that no longer exists is the portable spelling.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` / `Field(...)` as a default value is the documented idiom of
# typer and pydantic; B008 cannot be satisfied without breaking both.
"regix/cli.py" = ["B008"]
"regix/api.py" = ["B008"]
"regix/config.py" = ["B008"]
